# Alembic's command line, run from gateway/ (the gateway applies the migrations itself at start-up). The database
# comes from the gateway's settings (DATABASE_URL or gateway/.env, else the local platform-db), not from this file.
# New migration after changing app/tables.py, against the local database:
#   alembic revision --autogenerate -m "what changed"
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
